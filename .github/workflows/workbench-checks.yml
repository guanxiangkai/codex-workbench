name: Workbench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Backend contracts
        env:
          PYTHONPATH: src:tests
        run: python -m unittest tests.test_list_filters tests.test_snapshot_store tests.test_account_profiles tests.test_current_account tests.test_native_page tests.test_readonly_service tests.test_mcp tests.test_module_catalogs tests.test_other_accounts tests.test_model_catalog tests.test_resource_catalog_migration tests.test_account_identity tests.test_account_usage tests.test_bigmodel_usage tests.test_view_cache tests.test_account_onboarding tests.test_account_snapshot tests.test_reset_analysis tests.test_gateway_daemon tests.test_model_gateway tests.test_service tests.test_ui_release tests.test_planning tests.test_planning_assets tests.test_planning_draft tests.test_planning_notes tests.test_planning_service tests.test_model_probe tests.test_planning_intake tests.test_planning_context tests.test_planning_delivery tests.test_planning_delivery_integration tests.test_planning_coordination tests.test_planning_models tests.test_planning_output tests.test_planning_statistics tests.test_account_routing tests.test_gateway_control tests.test_execution_accounts tests.test_executor tests.test_runner tests.test_sessions tests.test_store
      - name: UI and encrypted detail contracts
        run: WORKBENCH_TEST_PYTHON="$(command -v python)" python publish_ui.py
      - name: Release matches sources
        run: git diff --exit-code -- ui/release.json
