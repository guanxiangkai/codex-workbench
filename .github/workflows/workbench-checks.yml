name: Workbench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Commit identity privacy
        run: python scripts/check_commit_privacy.py
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          curl --fail --silent --show-error --location --output "$audit_dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="--all --full-history" --report-path="$audit_dir/history.json" >"$audit_dir/history.log" 2>&1 || { echo "Secret scan blocked publication; inspect locally with redaction enabled."; exit 1; }
          "$audit_dir/gitleaks" dir . --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth=3 --max-decode-depth=5 --report-path="$audit_dir/tree.json" >"$audit_dir/tree.log" 2>&1 || { echo "Working tree secret scan blocked publication; inspect locally with redaction enabled."; exit 1; }
      - name: Backend contracts
        env:
          PYTHONPATH: src:tests
        run: python -m unittest tests.test_configuration_metadata tests.test_configuration_center tests.test_list_filters tests.test_snapshot_store tests.test_account_profiles tests.test_readonly_service tests.test_other_accounts tests.test_model_catalog tests.test_resource_catalog_migration tests.test_account_identity tests.test_account_usage tests.test_bigmodel_usage tests.test_account_management_catalog tests.test_knowledge_catalog tests.test_current_account tests.test_account_onboarding tests.test_account_snapshot tests.test_reset_analysis tests.test_gateway_daemon tests.test_model_gateway tests.test_service tests.test_ui_release tests.test_model_probe tests.test_registered_model_verifier tests.test_account_routing tests.test_gateway_control tests.test_execution_accounts tests.test_sessions tests.test_store tests.test_account_runtime tests.test_mcp
      - name: UI and encrypted detail contracts
        run: WORKBENCH_TEST_PYTHON="$(command -v python)" python publish_ui.py
      - name: Release matches sources
        run: git diff --exit-code -- ui/release.json
