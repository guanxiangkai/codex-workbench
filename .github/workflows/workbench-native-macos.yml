name: Workbench native CLI candidate

on:
  push:
    branches: [ci/workbench-native-0.167.0-alpha.3.2]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CLI_VERSION: 0.167.0-alpha.3.2
      CODEX_SOURCE: c40729ea5cf8e947481b130c59807273eda2f8e9
      PATCH_SHA256: 5a71bce953a2ef6f8d644ea97383277040b033aef20274f8bcfeab431f3250db
      TARGET: x86_64-apple-darwin
      CARGO_INCREMENTAL: '0'
      # Match the pinned upstream macOS release workflow for native submodules.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out the exact upstream source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: c40729ea5cf8e947481b130c59807273eda2f8e9
          persist-credentials: false
      - name: Check out the Workbench patch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: workbench-patch
          persist-credentials: false
      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$CODEX_SOURCE"
          patch="$PWD/workbench-patch/native-runtime/native-account-selection.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | shasum -a 256 -c
          git apply --check --whitespace=error -p1 --directory=codex-rs "$patch"
          git apply --whitespace=error -p1 --directory=codex-rs "$patch"
          df -h .
      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          targets: x86_64-apple-darwin
      - name: Verify upstream V8 build inputs
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-apple-darwin
      - name: Resolve the lockfile without changing pinned dependencies
        working-directory: codex-rs
        shell: bash
        timeout-minutes: 25
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: '1'
          GIT_HTTP_LOW_SPEED_TIME: '120'
          CARGO_HTTP_TIMEOUT: '120'
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/reviewed-Cargo.lock"
          cargo metadata --format-version 1 --filter-platform "$TARGET" > /dev/null
          python3 - "$RUNNER_TEMP/reviewed-Cargo.lock" Cargo.lock "$CLI_VERSION" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          reviewed, resolved = (tomllib.loads(Path(p).read_text()) for p in sys.argv[1:3])
          release = sys.argv[3]
          # The tagged workspace manifest has the release version, while its
          # lockfile still uses 0.0.0 for local workspace packages.
          normalized = []
          for item in reviewed["package"]:
              if "source" not in item and "checksum" not in item and item["version"] == "0.0.0":
                  item["version"] = release
                  normalized.append(item["name"])
          if len(normalized) != 171:
              raise SystemExit(f"Unexpected workspace version placeholders: {len(normalized)}")

          def packages(lock):
              return {
                  (p["name"], p["version"], p.get("source"), p.get("checksum")):
                  sorted(p.get("dependencies", ()))
                  for p in lock["package"]
              }
          expected, actual = packages(reviewed), packages(resolved)
          if expected != actual:
              added = sorted(map(str, actual.keys() - expected.keys()))
              removed = sorted(map(str, expected.keys() - actual.keys()))
              edges = sorted(str(k) for k in expected.keys() & actual.keys() if expected[k] != actual[k])
              raise SystemExit(f"Unexpected lockfile change: added={added}; removed={removed}; edges={edges}")
          print(f"Normalized {len(normalized)} workspace versions; all dependency identities and edges match.")
          PY
          shasum -a 256 "$RUNNER_TEMP/reviewed-Cargo.lock" Cargo.lock
      - name: Check that a turn keeps its account and the next turn switches
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo test --locked --target "$TARGET" --profile dev-small -p codex-core --lib \
            workbench_default_switch_uses_new_token_on_the_same_thread \
            | tee "$RUNNER_TEMP/routing-test.log"
          grep -F 'workbench_default_switch_uses_new_token_on_the_same_thread ... ok' "$RUNNER_TEMP/routing-test.log"
      - name: Build and identify the candidate
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export STABLE_GIT_COMMIT="$CODEX_SOURCE"
          cargo build --locked --target "$TARGET" --profile dev-small -p codex-cli --bin codex
          candidate="target/$TARGET/dev-small/codex"
          test "$(lipo -archs "$candidate")" = x86_64
          test "$("$candidate" --version)" = "codex-cli $CLI_VERSION"
          staging="$(mktemp -d)"
          cp "$candidate" "$staging/codex"
          cp "$RUNNER_TEMP/routing-test.log" "$staging/"
          {
            printf 'source=%s\npatch_sha256=%s\nversion=%s\ntarget=%s\n' \
              "$CODEX_SOURCE" "$PATCH_SHA256" "$CLI_VERSION" "$TARGET"
            shasum -a 256 Cargo.lock
            rustc --version --verbose
          } > "$staging/build-info.txt"
          (cd "$staging" && shasum -a 256 codex > codex.sha256)
          tar -czf "$RUNNER_TEMP/workbench-native-candidate.tar.gz" -C "$staging" \
            codex codex.sha256 build-info.txt routing-test.log
      - name: Retain the candidate for verification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: workbench-native-0.167.0-alpha.3.2-x86_64
          path: ${{ runner.temp }}/workbench-native-candidate.tar.gz
          retention-days: 3
          if-no-files-found: error
